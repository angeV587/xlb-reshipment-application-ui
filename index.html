<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>补发申请单优化交互原型</title><style>

.workspace { grid-column: 2; grid-row: 2; min-width: 0; }
.page-tabs { display: flex; align-items: stretch; height: 32px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--xlb-line); }
.page-tabs > button, .page-tabs > a { display: inline-flex; align-items: center; justify-content: center; gap: 12px; flex: none; height: 32px; min-width: 120px; margin: 0; padding: 0 17px; border: 0; border-right: 1px solid var(--xlb-line); background: #fff; color: var(--xlb-text); text-decoration: none; white-space: nowrap; font-size: 14px; }

.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 24px; margin: 0 8px 18px; flex: none; }

.field { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 28px; margin: 0; }

.detail-tabs, .tabs { display: flex; align-items: stretch; gap: 26px; min-height: 32px; height: 32px; border-bottom: 1px solid #edf0f4; flex: none; }

}

  const organizations = [{id:'o1',name:'示例二级组织A'},{id:'o2',name:'示例二级组织B'}];

  function modalFrame(title,body,footer,size='medium'){return `<div class="modal-mask"><section class="modal ${size}" role="dialog" aria-modal="true" aria-label="${title}"><header class="modal-header"><h2>${title}</h2><button class="close" data-action="close-modal" aria-label="关闭">${icon('close')}</button></header><div class="modal-body">${body}</div><footer class="modal-footer">${footer}</footer></section></div>`;}
  function openApprovalSettings(){
    if(!permission('query'))return;
    const rows=Object.entries(db.settings).map(([key,go],index)=>{const [org='',reasonId='']=key.split('|');return {id:`setting-${index+1}`,org,reason:reasonId,go:go!==false};});
    state.modal={type:'approval',rows,nextId:rows.length+1};
    renderModal();
  }
  function settingReasonControl(row,index,editable){
    const applicable=db.reasons.filter(r=>r.orgs.includes(row.org));
    const current=reason(row.reason),invalidCurrent=row.reason&&!applicable.some(r=>r.id===row.reason);
    return `<select class="control" data-field="settingRow.${row.id}.reason" aria-label="第${index+1}行补发原因" ${!editable?'disabled':''}>${options(applicable,row.reason,'请选择')}${invalidCurrent?`<option value="${esc(row.reason)}" selected disabled>${esc(current?current.name+'（当前不适用）':'原原因（已失效）')}</option>`:''}</select>`;
  }
  function approvalModal(m){
    const editable=permission('config');
    const rows=m.rows||[];
    return modalFrame('审批设置',`<div class="toolbar">${btn('新增','add-setting-row','plus',!editable)}</div><div class="table-wrap approval-settings-table-wrap"><table class="table approval-settings-table"><colgroup><col style="width:300px"><col style="width:300px"><col style="width:190px"><col style="width:100px"></colgroup><thead><tr><th>二级组织</th><th>补发原因</th><th>审核后走审批流</th><th>操作</th></tr></thead><tbody>${rows.map((row,index)=>{const orgItems=organizations.some(x=>x.id===row.org)||!row.org?organizations:[...organizations,{id:row.org,name:'原组织（已失效）'}];return `<tr data-setting-row="${row.id}"><td>${selectorControl(`settingRow.${row.id}.org`,orgItems,row.org,'请选择',!editable)}</td><td>${settingReasonControl(row,index,editable)}</td><td class="check"><input type="checkbox" data-field="settingRow.${row.id}.go" aria-label="第${index+1}行审核后走审批流" ${row.go?'checked':''} ${!editable?'disabled':''}></td><td><button class="link" data-action="remove-setting-row" data-id="${row.id}" ${!editable?'disabled':''}>删除</button></td></tr>`;}).join('')}</tbody></table>${!rows.length?'<div class="empty" style="padding:36px 10px">暂无配置</div>':''}</div>${state.note?'<div class="annotation"><span class="number">1</span><span>行内新增、编辑、删除，保存统一生效，取消恢复。每组合唯一，未配置默认走审批，已有审核快照不变。</span></div>':''}`,`${btn('取消','close-modal')}${btn('保存','save-setting','save',!editable)}`,'approval-settings-modal');
  }
  function validateApprovalRows(rows){
    const errors=[],seen=new Set();
    rows.forEach((row,index)=>{
      const prefix=`第${index+1}行：`;
      if(!row.org||!row.reason){errors.push(prefix+'请选择二级组织和补发原因');return;}
      if(!organizations.some(x=>x.id===row.org)){errors.push(prefix+'二级组织已失效，请重新选择或删除该行');return;}
      const item=reason(row.reason);
      if(!item||!item.orgs.includes(row.org)){errors.push(prefix+'补发原因不适用于所选二级组织，请重新选择或删除该行');return;}
      const key=`${row.org}|${row.reason}`;
      if(seen.has(key))errors.push(prefix+'二级组织与补发原因组合重复');
      seen.add(key);
    });
    return errors;
  }
  function saveApprovalSettings(){
    if(!permission('config')||state.modal?.type!=='approval')return;
    const m=state.modal,errors=validateApprovalRows(m.rows);
    if(errors.length){state.parentModal=m;notify(errors.join('\n'));return;}
    const previous=db.settings,next=Object.fromEntries(m.rows.map(row=>[`${row.org}|${row.reason}`,!!row.go]));
    for(const key of new Set([...Object.keys(previous),...Object.keys(next)])){
      const [org,reasonId]=key.split('|');

    if(action==='open-calendar'){openCalendar(el);return;}else if(action==='calendar-date'){chooseCalendar(el.dataset.date);return;}else if(action==='calendar-shortcut'){calendarShortcut(el.dataset.shortcut);return;}else if(action==='calendar-prev'||action==='calendar-next'){state.calendarMonth+=action==='calendar-prev'?-1:1;renderCalendar();return;}else if(action==='scope-all'){const m=state.modal,ids=m.items.filter(x=>!m.query||`${x.name} ${x.id}`.toLowerCase().includes(m.query.toLowerCase())).map(x=>x.id);m.selected=ids.every(id=>m.selected.includes(id))?m.selected.filter(id=>!ids.includes(id)):[...new Set([...m.selected,...ids])];renderModal();return;}else if(action==='scope-query'){renderModal();return;}else if(action==='scope-confirm'){confirmScope();return;}else if(action==='nav-config')navigate('config');else if(action==='nav-list'||action==='back')navigate('list');else if(action==='new')newRecord();else if(action==='open')openRecord(id);
    else if(action==='query-list'||action==='query-config')render();else if(action==='reset-list'){resetFilters();state.selected=[];render();}else if(action==='reset-config'){state.configFilters={name:'',enabled:'',org:[],product:''};state.selectedReasons=[];render();}
    else if(action==='approval-settings')openApprovalSettings();
    else if(action==='add-setting-row'){if(!permission('config')||state.modal?.type!=='approval')return;const m=state.modal;m.rows.push({id:`setting-${m.nextId++}`,org:'',reason:'',go:true});renderModal();}
    else if(action==='remove-setting-row'){if(!permission('config')||state.modal?.type!=='approval')return;state.modal.rows=state.modal.rows.filter(row=>row.id!==id);renderModal();}
    else if(action==='save-setting')saveApprovalSettings();
    else if(action==='close-modal'){if(state.selectorParent){state.modal=state.selectorParent;state.selectorParent=null;}else if(state.parentModal){state.modal=state.parentModal;state.parentModal=null;}else state.modal=null;renderModal();}
    else if(action==='new-reason'||action==='edit-reason'){if(action==='new-reason'&&!permission('config'))return;if(action==='edit-reason'&&!permission('query'))return;state.modal={type:'reason',...(action==='edit-reason'?clone(reason(id)):{id:'',name:'',description:'',orgs:[],products:[]})};renderModal();}
    else if(action==='pick-reason-organizations'){openOrganization('reason.orgs');}else if(action==='remove-bound-product'){if(!permission('config'))return;state.modal.products=state.modal.products.filter(x=>x!==id);renderModal();}
    else if(action==='save-reason'){if(!permission('config'))return;const m=state.modal;if(!m.name||!m.orgs.length||!m.products.length)return notify('请填写原因名称、应用组织及绑定商品');const value={...m,id:m.id||`r${Date.now()}`,enabled:m.enabled??true};delete value.type;const idx=db.reasons.findIndex(x=>x.id===value.id);if(idx<0)db.reasons.push(value);else db.reasons[idx]=value;persist();state.modal=null;render();}
    else if(action==='history')notify(db.history.length?db.history.map(x=>`${x.time}　${x.message}`).join('\n'):'暂无修改记录','修改记录');
    else if(action==='reason-products'){const r=reason(id);notify(r.products.map(p=>{const x=product(p);return `${x.code}　${x.name}`;}).join('\n'),'绑定商品');}
    else if(action==='pick-products'){state.pickerExistingIds=state.working.lines.map(x=>x.id);state.picker=[...state.pickerExistingIds];state.pickerQuery='';state.pickerKeyword='';state.pickerCategory='';state.pickerTag='';state.pickerTab='available';state.modal={type:'products',target:'application'};renderModal();}
    else if(action==='pick-reason-products'){if(!permission('config'))return;state.parentModal=state.modal;state.picker=[...state.modal.products];state.pickerQuery='';state.pickerKeyword='';state.pickerCategory='';state.pickerTag='';state.pickerTab='available';state.modal={type:'products',target:'reason',ids:[...state.picker]};renderModal();}
    else if(action==='query-picker')renderModal();else if(action==='confirm-products'){if(state.modal.target==='reason'){if(!permission('config'))return;state.parentModal.products=[...state.picker];state.modal=state.parentModal;state.parentModal=null;renderModal();}else{const invalid=state.picker.filter(id=>Number(product(id).stock)<=0),selected=state.picker.filter(id=>Number(product(id).stock)>0);state.working.lines=selected.map(pid=>state.working.lines.find(x=>x.id===pid)||line(pid));state.modal=null;render();if(invalid.length)notify(`以下商品库存小于等于0，已移除：\n${invalid.map(id=>`${product(id).code}　${product(id).name}`).join('\n')}`);}}
    else if(action==='picked-tab'||action==='available-tab'){state.pickerTab=action==='picked-tab'?'selected':'available';renderModal();}
    else if(action==='remove-line'){state.working.lines=state.working.lines.filter(x=>x.id!==id);render();}
    else if(action==='proof'){const ln=state.working.lines.find(x=>x.id===id);if(state.working.status==='制单'&&permission('edit')){ln.proof=true;render();}notify('此处使用示例凭证，未上传真实图片。','图片凭证');}
    else if(action==='save'){if(saveRecord()){render();notify('保存成功');}}else if(action==='audit')audit();else if(action==='delete')deleteSelected();
    else if(action==='confirm-delete'){db.records=db.records.filter(r=>!state.modal.ids.includes(r.id));state.selected=[];state.modal=null;persist();render();notify('删除成功');}
    else if(action==='retry'){const r=db.records.find(x=>x.id===id);if(!r||!canRetry(r))return;generate(r);persist();updateWorking();render();notify(r.orderStatus==='已审核'?'重试成功，门店订单已审核。':r.failure||'门店订单已生成');}
    else if(action==='void'){state.modal={type:'void'};renderModal();}else if(action==='confirm-void'){const r=state.working;if(r.status==='审核'&&r.approval==='审批中'&&!r.order){r.status='作废';r.approval='';saveRecord(true);state.modal=null;render();}}
    else if(action==='tab-basic'||action==='tab-other'){state.detailTab=action==='tab-basic'?'basic':'other';render();}
    else if(action==='export-list')download('列表',listRows());else if(action==='export-detail')download('明细',db.records.filter(r=>state.selected.includes(r.id)));else if(action==='export-current')download('明细',[state.working]);
    else if(action==='import')notify('导入沿用现有补发申请模板；本演示可通过【新增】创建示例单据。','导入');
    else if(action==='demo-reset'){db=seed();persist();state.selected=[];state.selectedReasons=[];state.currentId='';state.working=null;state.view='config';resetFilters();state.modal=null;render();}
    else if(action==='demo-approve'||action==='demo-reject'){const r=db.records.find(x=>x.id===state.demoRecord);if(!r||r.approval!=='审批中'){notify('请选择审批中的示例单据');return;}if(action==='demo-approve'){r.approval='已通过';generate(r);}else{r.approval='已驳回';r.status='制单';r.reject='示例审批意见：请补充损坏说明后重新审核';}persist();updateWorking();render();}
    else if(action==='check-all'){const rows=listRows();state.selected=rows.every(r=>state.selected.includes(r.id))?state.selected.filter(id=>!rows.some(r=>r.id===id)):[...new Set([...state.selected,...rows.map(r=>r.id)])];render();}
    else if(action==='check-all-reasons'){const ids=db.reasons.map(r=>r.id);state.selectedReasons=ids.every(id=>state.selectedReasons.includes(id))?[]:ids;render();}
    else if(action==='check-products'){const ids=pickerRows(state.modal).map(x=>x.id);state.picker=ids.every(x=>state.picker.includes(x))?state.picker.filter(x=>!ids.includes(x)):[...new Set([...state.picker,...ids])];renderModal();}
    else if(action==='toggle-filters'){const f=$('#filter-panel');if(f)f.hidden=!f.hidden;}
    else if(action==='columns')notify('列顺序、宽度及横向滚动沿用当前新零帮列表；本演示未改变列配置能力。','列配置');
    else if(action==='baseline'||action==='unchanged-nav')notify('该入口为既有系统导航，本原型仅演示补发申请单及补发申请配置。');
    else if(action==='nav-menu')notify('通过顶部【补发申请配置】【补发申请单】页签切换本次演示页面。');
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.dataset.orgChoice){const m=state.modal,id=el.dataset.orgChoice;if(m.multiple)m.selected=el.checked?[...new Set([...m.selected,id])]:m.selected.filter(x=>x!==id);else m.selected=el.checked?[id]:[];renderModal();return;}
    if(el.dataset.storeChoice){const m=state.modal;toggleStore(m,el.dataset.storeChoice,el.checked);renderModal();return;}
    if(el.dataset.recordCheck){const id=el.dataset.recordCheck;state.selected=el.checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id);render();return;}
    if(el.dataset.reasonCheck){const id=el.dataset.reasonCheck;state.selectedReasons=el.checked?[...state.selectedReasons,id]:state.selectedReasons.filter(x=>x!==id);render();return;}
    if(el.dataset.productCheck){const id=el.dataset.productCheck;state.picker=el.checked?[...new Set([...state.picker,id])]:state.picker.filter(x=>x!==id);renderModal();return;}
    if(el.dataset.scopeChoice){const id=el.dataset.scopeChoice;if(state.modal.multiple)state.modal.selected=el.checked?[...new Set([...state.modal.selected,id])]:state.modal.selected.filter(x=>x!==id);else state.modal.selected=id;renderModal();return;}
    if(el.dataset.reasonOrg){if(!permission('config'))return;const id=el.dataset.reasonOrg;state.modal.orgs=el.checked?[...state.modal.orgs,id]:state.modal.orgs.filter(x=>x!==id);return;}
    if(el.dataset.quantity){const ln=state.working.lines.find(x=>x.id===el.dataset.quantity);ln.qty=Number(el.value);render();return;}
    const name=el.dataset.field;if(!name)return;const [group,key]=name.split('.');
    if(group==='settingRow'){if(!permission('config')||state.modal?.type!=='approval')return;const [,rowId,property]=name.split('.'),row=state.modal.rows.find(x=>x.id===rowId);if(!row)return;if(property==='reason')row.reason=el.value;else if(property==='go')row.go=el.checked;renderModal();}
    else if(group==='setting'){if(key==='org'){state.modal.org=el.value;state.modal.reason='';state.modal.go=true;}else if(key==='reason'){state.modal.reason=el.value;state.modal.go=requires(state.modal.org,el.value);}else state.modal.go=el.value==='true';renderModal();}
    else if(group==='detail'&&key==='store'){state.working.store=el.value;state.working.org=stores.find(x=>x.id===el.value)?.org||'';state.working.reason='';state.working.lines=[];render();}
    else if(group==='detail'&&key==='reason'){state.working.reason=el.value;state.working.lines=[];render();}
    else if(group==='filter'){state.filters[key]=el.value;if(key==='grain'){const start=new Date(`${state.filters.start||TODAY}T12:00:00`);if(el.value==='周'){const day=start.getDay()||7;start.setDate(start.getDate()-day+1);const end=new Date(start);end.setDate(end.getDate()+6);state.filters.start=start.toISOString().slice(0,10);state.filters.end=end.toISOString().slice(0,10);}else if(el.value==='月'){const year=start.getFullYear(),month=start.getMonth();state.filters.start=`${year}-${String(month+1).padStart(2,'0')}-01`;state.filters.end=new Date(year,month+1,0,12).toISOString().slice(0,10);}else if(el.value==='年'){state.filters.start=`${start.getFullYear()}-01-01`;state.filters.end=`${start.getFullYear()}-12-31`;}else{state.filters.start=TODAY;state.filters.end=TODAY;}render();}}
    else if(group==='config')state.configFilters[key]=el.value;
    else if(group==='storePick'){if(key==='groupQuery')state.modal.groupQuery=el.value;else if(key!=='groupType')state.modal.filters[key]=el.value;}
    else if(group==='picker'){if(key==='category')state.pickerCategory=el.value;else if(key==='tag')state.pickerTag=el.value;}
    else if(group==='demo'){state.demoOpen=true;if(key==='record')state.demoRecord=el.value;else state[key]=el.value;render();}
  });
  document.addEventListener('input',event=>{const el=event.target,name=el.dataset.field;if(!name)return;const [group,key]=name.split('.');if(group==='filter')state.filters[key]=el.value;else if(group==='config')state.configFilters[key]=el.value;else if(group==='detail'&&key==='description')state.working.description=el.value;else if(group==='picker'){if(key==='query')state.pickerQuery=el.value;else if(key==='keyword')state.pickerKeyword=el.value;else if(key==='category')state.pickerCategory=el.value;else if(key==='tag')state.pickerTag=el.value;}else if(group==='reason'){if(!permission('config'))return;state.modal[key]=key==='enabled'?el.value==='true':el.value;}else if(group==='scope')state.modal.query=el.value;else if(group==='org'){state.modal.query=el.value;refreshOrganizationTree();}else if(group==='storePick'){if(key==='groupQuery'){state.modal.groupQuery=el.value;const tree=$('.store-group-tree');if(tree)tree.innerHTML=storeGroupTree(state.modal);}else if(key!=='groupType')state.modal.filters[key]=el.value;}if((group==='reason'||group==='detail')&&key==='description'){const counter=document.querySelector(`[data-counter="${name}"]`);if(counter)counter.textContent=`${el.value.length}/${group==='reason'?200:500}`;}});
  document.addEventListener('click',event=>{if(!event.target.closest('.xlb-combobox'))document.querySelectorAll('.xlb-combobox .dropdown-menu').forEach(x=>x.remove());if(state.calendarOpen&&!event.target.closest('.calendar-popup,.date-range'))closeCalendar();});
  if(state.view==='detail')openRecord(params.get('id')||db.records[0]?.id);else render();
})();

</script></body></html>
